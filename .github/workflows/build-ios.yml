name: Build Allerix iOS

on:
  workflow_dispatch:
  push:
    branches: [ios-flutter]
    paths:
      - 'ios_flutter/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS runner
        run: flutter create --project-name allerix_ios --platforms=ios .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Upload unsigned iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: allerix-ios-unsigned-app
          path: ios_flutter/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7

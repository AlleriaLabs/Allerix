name: Build APK
on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1). Leave empty to only build."
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AlleriaFilmotheque.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AlleriaFilmotheque-apk
          path: AlleriaFilmotheque.apk
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          cat > notes.md <<'NOTES'
          First release of the Alleria Filmotheque Android app.

          - Netflix-style home with auto-rotating banner carousel and blurred scene background
          - Built-in MX Player-style player: gesture controls, pinch zoom, 2x long-press, PiP, resume sync
          - Quality (480p to 4K) and audio (stereo, mono, 5.1, 7.1) settings in the player
          - Editable server URL in Settings

          Install: download AlleriaFilmotheque.apk on your Android phone and allow "Install unknown apps".
          NOTES
          gh release create "$TAG" AlleriaFilmotheque.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Alleria Filmotheque $TAG" --notes-file notes.md
